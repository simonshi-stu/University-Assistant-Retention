[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-retention"
version = "0.1.0"
description = "Course retention analytics pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
    "streamlit>=1.32,<2",
    "plotly>=5.18,<7",
    "networkx>=3.2,<4",
    "pyarrow>=15,<25",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
